name: CI - Code Quality & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build Verification & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats formatting errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Verify Module Imports & Configuration
        run: |
          python -c "import config; import lead_generator; print('Module imports verified successfully.')"

      - name: Generate Build Verification Report
        run: |
          mkdir -p build_reports
          python -c "
          import config, json, os
          report = {
              'status': 'SUCCESS',
              'python_version': '3.11',
              'config_file': os.path.exists('config.py'),
              'lead_generator': os.path.exists('lead_generator.py'),
              'categories_count': len(open('categories.txt', encoding='utf-8').readlines()),
              'locations_count': len(open('locations.txt', encoding='utf-8').readlines())
          }
          with open('build_reports/verification_report.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, indent=2)
          print('Build report generated.')
          "

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-verification-report
          path: build_reports/verification_report.json
